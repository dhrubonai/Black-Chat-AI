<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="referrer" content="no-referrer">
<title>Black Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
:root {
  --bg:#000;
  --card:#11121a;
  --accent:#ff007a;
  --accent2:#5a4fff;
  --user:#22c55e;
  --bot:#2563eb;
  --text:#ffffff;
  --text-muted:#b3b3b3;
  --bar:#0f0f19;
  --glass: rgba(255, 255, 255, 0.05);
  --border: rgba(255, 255, 255, 0.1);
}
body[data-theme="light"]{
  --bg:#f3f4f6;--card:#ffffff;--bar:#e5e7eb;--text:#111827;--text-muted:#6b7280;
  --glass: rgba(0, 0, 0, 0.05); --border: rgba(0, 0, 0, 0.1);
}
body[data-theme="amoled"]{--bg:#000000;--card:#050505;--bar:#050505;}
body[data-theme="neon"]{
  --bg:#020617;--card:#020617;--bar:#020617;
  --accent:#ff00e5;--accent2:#00f6ff;--bot:#7c3aed;
}
body[data-theme="ocean"]{
  --bg:#020617;--card:#031525;--bar:#020617;
  --accent:#0ea5e9;--accent2:#22c55e;--bot:#0ea5e9;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Poppins",sans-serif;background:var(--bg);color:var(--text);
  height: 100dvh; 
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* --- ANIMATIONS & CORE ELEMENTS --- */
#intro{
  position:fixed;inset:0;background:#000;display:flex;
  justify-content:center;align-items:center;flex-direction:column;
  animation:introFade 1.25s ease forwards;z-index:70;pointer-events:none;
}
#intro img{width:90px;border-radius:50%;animation:pulse 1s infinite alternate;}
#intro h1{margin-top:12px;font-size:1.3rem;font-weight:600;}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes introFade{0%,85%{opacity:1}100%{opacity:0;visibility:hidden}}

/* HEADER */
header{
  padding:10px 14px;border-bottom:1px solid #242436;background:var(--bar);
  display:flex;justify-content:space-between;align-items:center;
  z-index:50;
  flex-shrink: 0;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
}
.header-left{display:flex;gap:10px;align-items:center}
header img{
  width:36px;height:36px;border-radius:50%;
}

.icon-btn{
  width:32px;height:32px;border:none;border-radius:50%;background:var(--card);
  color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.icon-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 10px rgba(255, 0, 122, 0.4);
}

/* CHAT MESSAGES */
#messages{
  flex-grow:1;
  overflow-y:auto;
  padding:12px;
  scroll-behavior:smooth;
  display: flex;
  flex-direction: column;
}
.msg{
  max-width:85%;margin-bottom:12px;padding:9px 12px;border-radius:16px;
  font-size:.9rem;white-space:pre-wrap;animation:fade .25s ease;word-wrap:break-word;
  position: relative;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.user{margin-left:auto;background:var(--user);color:#000;border-radius:16px 16px 4px 16px}
.bot{background:var(--bot);border-radius:16px 16px 16px 4px; align-self: flex-start;}
.uploaded-img{
  max-width: 100%;
  border-radius: 8px;
  margin-top: 5px;
  display: block;
}

/* MESSAGE ACTIONS */
.msg-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 6px;
  opacity: 0.8;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 4px;
}
.action-btn {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.9);
  font-size: 0.8rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: 0.2s;
  display: flex; align-items: center; gap: 4px;
}
.action-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

/* CONTROLS (Bottom) */
.controls-container {
  flex-shrink: 0;
  background: var(--bar);
  border-top: 1px solid #242436;
  z-index: 60;
  display: flex;
  flex-direction: column;
}

/* PREVIEW AREA */
#previewArea {
  display: none;
  padding: 10px;
  background: var(--bar);
  border-bottom: 1px solid #333;
}
.preview-card {
  position: relative;
  display: inline-block;
}
.preview-card img {
  height: 60px;
  border-radius: 8px;
  border: 1px solid var(--accent);
}
.preview-remove {
  position: absolute;
  top: -5px;
  right: -5px;
  background: red;
  color: white;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  font-size: 12px;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.controls{
  display:flex;gap:6px;padding:10px;
  align-items: flex-end;
}
textarea{
  flex:1;border-radius:22px;background:var(--card);
  border:1px solid #33354a;color:var(--text);
  padding:9px 14px;resize:none;max-height:120px;font-family:inherit;outline:none;
  min-height: 40px;
}
button#send{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;
  border:none;border-radius:22px;padding:0 20px;font-weight:600;cursor:pointer;
  height: 40px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
button#send:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 0, 122, 0.5);
}
#uploadBtn {
    background: transparent;
    color: var(--accent);
    padding: 0 12px;
    font-size: 1.2rem;
    border: 1px solid #33354a;
    border-radius: 22px;
    height: 40px;
    display: flex; align-items: center;
}
#uploadBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 10px rgba(255, 0, 122, 0.4);
}

/* SETTINGS SHEET */
#settingsSheet{
  position:fixed;bottom:-100%;left:0;right:0;
  background:var(--card);border-radius:18px 18px 0 0;
  box-shadow:0 -10px 35px rgba(0,0,0,.8);
  padding:14px;transition:.33s ease-out;z-index:80;
  max-height:78vh;overflow-y:auto;
}
#settingsSheet.open{
  bottom:0;animation:slideUp .28s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:.3}}
.sheet-handle{
  width:40px;height:4px;background:#555;border-radius:99px;
  margin:0 auto 10px;
}
.sheet-back{
  background:none;border:none;color:var(--accent);
  font-size:.9rem;margin-bottom:6px;cursor:pointer;
}
.sheet-section{
  margin-top:12px;border-top:1px solid #222;padding-top:10px;
}
.section-title{font-size:.82rem;font-weight:600;margin-bottom:4px}
.settings-input{width:100%;min-height:60px;border-radius:10px;padding:8px;background:#000;color:var(--text);border:1px solid #333;}
select{width:100%;padding:8px;border-radius:8px;background:#000;color:var(--text);border:1px solid #333;}

/* CREATOR PANEL */
#creatorPanel{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  z-index:100;opacity:0;pointer-events:none;transition:.33s;
}
#creatorPanel.open{
  opacity:1;pointer-events:auto;animation:fadeIn .25s ease;
}
.creator-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 30px;
  border-radius: 24px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  position: relative;
  animation: slideUp .33s ease;
}
.creator-card img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent);
  margin-bottom: 15px;
  box-shadow: 0 0 20px rgba(255, 0, 122, 0.3);
}
.creator-name {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 5px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.creator-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 20px;
}
.creator-links {
  display: flex;
  justify-content: center;
  gap: 15px;
}
.social-btn {
  width: 40px; 
  height: 40px;
  border-radius: 50%;
  background: var(--bar);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: .2s;
  font-size: 1.2rem;
}
.social-btn:hover {
  background: var(--accent);
  color: white;
  transform: translateY(-3px);
}
.close-creator {
  position: absolute;
  top: 15px;
  right: 15px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.2rem;
  cursor: pointer;
}
.clear-btn {
    background: #ef4444;
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
}
</style>
</head>

<body data-theme="dark">
<div id="intro">
  <img src="https://i.ibb.co/6JX8d2RT/file-51.jpg"/>
  <h1>BLACK CHAT</h1>
</div>

<header>
  <div class="header-left">
    <img src="https://i.ibb.co/6JX8d2RT/file-51.jpg"/>
    <div>
      <h1>Black Chat</h1>
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <button id="shareBtn" class="icon-btn" title="Share">

        <div class="preview-card">
            <img id="previewImgSrc" src="" />
            <button class="preview-remove" onclick="removePreview()">×</button>

      Building AI experiences for everyone.if you face any problem or have any suggestion please feel free to contact me<br>
      <span style="font-size:0.75rem; opacity:0.7;">Free to use. Driven by passion.</span>
    </p>
    <div class="creator-links">
      <a href="https://www.facebook.com/mohiuddin.abdul.kadir.2025" target="_blank" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="https://www.instagram.com/dhrubo_morse?igsh=aHNsazZyOTY4dWN2" target="_blank" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
      <a href="mailto:dhrubonai01@gmail.com" class="social-btn"><i class="fa-solid fa-envelope"></i></a>
    </div>

<script>
// --- CONSTANTS ---
const textAPI_BASE = "https://text.pollinations.ai/"; 
const imgAPI = "https://image.pollinations.ai/prompt/";

// Google Search API
const GOOGLE_API_KEY = "AIzaSyDU9EVvJdgNVCpXBM9kE3y-MZY98-2KDyA";
const SEARCH_ENGINE_ID = "YOUR_SEARCH_ENGINE_ID"; 

// --- STATE MANAGEMENT ---
let memory = [];
let settings = {};
let pendingImage = null;

try { memory = JSON.parse(localStorage.getItem("blackchat_memory") || "[]"); } catch (e) { memory = []; }
try { settings = JSON.parse(localStorage.getItem("blackchat_settings") || "{}"); } catch (e) { settings = {}; }

settings.stylePrompt = settings.stylePrompt || "";
settings.theme = settings.theme || "dark";

// --- ELEMENTS ---
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const settingsBtn = document.getElementById("settingsBtn");
const settingsSheet = document.getElementById("settingsSheet");
const closeSettings = document.getElementById("closeSettings");
const stylePromptEl = document.getElementById("stylePrompt");
const themeSelectEl = document.getElementById("themeSelect");
const creatorBtn = document.getElementById("creatorBtn");
const creatorPanel = document.getElementById("creatorPanel");
const closeCreator = document.getElementById("closeCreator");
const shareBtn = document.getElementById("shareBtn");
const clearMemBtn = document.getElementById("clearMemBtn");
const imageInput = document.getElementById("imageInput");
const previewArea = document.getElementById("previewArea");
const previewImgSrc = document.getElementById("previewImgSrc");

// --- INITIALIZATION ---
document.body.setAttribute("data-theme", settings.theme);
stylePromptEl.value = settings.stylePrompt;
themeSelectEl.value = settings.theme;

// --- FUNCTIONS ---
function saveSettings() {
  settings.stylePrompt = stylePromptEl.value.trim();
  settings.theme = themeSelectEl.value;
  localStorage.setItem("blackchat_settings", JSON.stringify(settings));
  document.body.setAttribute("data-theme", settings.theme);
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(t, r, imgData = null) {
  const d = document.createElement("div");
  d.className = "msg " + r;
  if (imgData) {
      const img = document.createElement("img");
      img.src = imgData;
      img.className = "uploaded-img";
      d.appendChild(img);
      if(t) {
        const txt = document.createElement("div");
        txt.style.marginTop="5px";
        txt.textContent = t;
        d.appendChild(txt);
      }
  } else {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    if(t && t.match(urlRegex)){
        d.innerHTML = t.replace(urlRegex, '<a href="$1" target="_blank" style="color:inherit;text-decoration:underline;">$1</a>');
    } else {
        d.textContent = t;
    }
    
    if (r === 'bot') {
        const actions = document.createElement("div");
        actions.className = "msg-actions";
        const copyBtn = document.createElement("button");
        copyBtn.className = "action-btn";
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
        copyBtn.onclick = () => {
             navigator.clipboard.writeText(t);
             copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
             setTimeout(()=> copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 2000);
        };
        actions.appendChild(copyBtn);
        d.appendChild(actions);
    }
  }
  messagesEl.appendChild(d);
  setTimeout(scrollBottom, 50);
  return d;
}

function detectLang(t) { return /[\u0980-\u09FF]/.test(t) ? "bn" : "en"; }

function systemPrompt() {
  const baseIdentity = "You are Black Chat. Creator: Mohiuddin Abdul Kadir Dhrubo.";
  const langInstruct = "Reply in Bangla if input is Bangla, else English.";
  const userStyle = settings.stylePrompt || "Short, friendly, fast, and helpful.";
  return `${baseIdentity} ${langInstruct} Style: ${userStyle}`;
}

function identityCheck(q) {
  return /(who (made|created)|your creator|who are you|what ai|are you chatgpt|developer|owner|model|about you|who built|identity|who designed)/i.test(q);
}
const identityEN = "Hello, I’m Black Chat — an independent AI assistant created by Mohiuddin Abdul Kadir Dhrubo.";
const identityBN = "হ্যালো, আমি ব্ল্যাকচ্যাট — একটি স্বাধীন এআই সহকারী যা মুহিউদ্দিন আব্দুল কাদির ধ্রুব তৈরি করেছেন।";

function enhancePrompt(p) {
  // Improved high-quality prompt
  return `${p}, cinematic lighting, hyperrealistic, 8k, highly detailed, sharp focus, photorealistic, vibrant colors, masterpiece`;
}

async function googleSearch(query) {
    if (!SEARCH_ENGINE_ID || SEARCH_ENGINE_ID === "YOUR_SEARCH_ENGINE_ID") return null; 
    const url = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${SEARCH_ENGINE_ID}&q=${encodeURIComponent(query)}`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.items && data.items.length > 0) {
            return data.items.map(item => `- ${item.title}: ${item.snippet}`).slice(0, 3).join("\n");
        }
        return null;
    } catch (e) { console.error(e); return null; }
}
function needsSearch(q) {
    const triggers = /^(who|what|where|when|why|how|latest|current|news|weather|price|vs|compare|search|find|google)/i;
    return triggers.test(q) && q.length > 3;
}

// --- MAIN CHAT LOGIC (UPDATED FOR VISION) ---
async function askBot(q, imgData = null) {
  const bubble = addMessage("...", "bot"); 

  if (identityCheck(q)) {
    bubble.textContent = detectLang(q) === "bn" ? identityBN : identityEN;
    return;
  }

  let searchContext = "";
  if (needsSearch(q)) { 
      bubble.textContent = "🔍";
      const searchRes = await googleSearch(q);
      if (searchRes) searchContext = `\n\n[Search Results for "${q}":\n${searchRes}]`;
      bubble.textContent = "...";
  }

  const sysPrompt = systemPrompt() + searchContext;
  
  // Build Messages Array for OpenAI format
  const messages = [];
  messages.push({ role: "system", content: sysPrompt });
  
  // Add recent history
  const recentMemory = memory.slice(-4);
  recentMemory.forEach(m => {
      if(m.text) messages.push({ role: m.role === "user" ? "user" : "assistant", content: m.text });
  });

  // Add current message (Text + Image if exists)
  if (imgData) {
      messages.push({
          role: "user",
          content: [
              { type: "text", text: q || "Analyze this image." },
              { type: "image_url", image_url: { url: imgData } }
          ]
      });
  } else {
      messages.push({ role: "user", content: q });
  }

  try {
      // Use POST request to send image data (Vision)
      const response = await fetch(textAPI_BASE, {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
          },
          body: JSON.stringify({
              messages: messages,
              model: 'openai', // Defaults to vision-capable model
              seed: Math.floor(Math.random() * 1000)
          })
      });

      if (!response.ok) throw new Error("API Error");
      let reply = await response.text();
      
      // --- START: MODIFICATION TO REMOVE POLLINATIONS AI MENTION ---
      // Regex to remove common Pollinations AI attributions at the end of the text.
      // It handles various phrasing and removes text following "Created by", "Made by", "Generated by", "Pollinations AI", etc.
      const attributionRegex = /\s*(?:Created|Made|Generated|Powered)\s*by.*|.*(?:Pollinations|pollinations)\s*(?:AI|ai)\s*$/i;
      reply = reply.replace(attributionRegex, '').trim();
      // --- END: MODIFICATION ---

      bubble.textContent = reply;
      
      // Re-append copy button
      const actions = document.createElement("div");
      actions.className = "msg-actions";
      const copyBtn = document.createElement("button");
      copyBtn.className = "action-btn";
      copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
      copyBtn.onclick = () => {
           navigator.clipboard.writeText(reply);
           copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
           setTimeout(()=> copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 2000);
      };
      actions.appendChild(copyBtn);
      bubble.appendChild(actions);

      // Save to memory (Text only to save space)
      memory.push({ role: "user", content: q, text: q }); 
      memory.push({ role: "assistant", content: reply, text: reply });
      localStorage.setItem("blackchat_memory", JSON.stringify(memory));
  } catch (err) {
      console.error(err);
      bubble.textContent = "⚠️ Error: Could not process request.";
  }
}

// --- IMAGE GENERATION ---
function generateImage(q) {
  const d = addMessage(q, "bot");
  d.textContent = "🎨 Generating ...";
  
  const img = document.createElement("img");
  img.className = "uploaded-img";
  img.alt = q;
  
  const seed = Math.floor(Math.random() * 99999);
  // High Quality: 720x720
  img.src = imgAPI + encodeURIComponent(enhancePrompt(q)) + "?width=720&height=720&model=flux&nologo=true&seed=" + seed;
  
  img.onload = () => {
      d.textContent = "";
      d.appendChild(img);
      
      const actions = document.createElement("div");
      actions.className = "msg-actions";
      
      const dlBtn = document.createElement("button");
      dlBtn.className = "action-btn";
      dlBtn.innerHTML = '<i class="fa-solid fa-download"></i> Download';
      dlBtn.onclick = async () => {
          try {
              dlBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
              const response = await fetch(img.src);
              const blob = await response.blob();
              const url = window.URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = "blackchat-" + Date.now() + ".png";
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              window.URL.revokeObjectURL(url);
              dlBtn.innerHTML = '<i class="fa-solid fa-check"></i> Saved';
              setTimeout(()=> dlBtn.innerHTML = '<i class="fa-solid fa-download"></i> Download', 2000);
          } catch(e) {
              console.error(e);
              window.open(img.src, '_blank');
              dlBtn.innerHTML = '<i class="fa-solid fa-download"></i> Download';
          }
      };
      
      actions.appendChild(dlBtn);
      d.appendChild(actions);
      scrollBottom();
  };
  img.onerror = () => {
      d.textContent = "❌ Failed to generate image. please try again";
  };
}

// --- INPUT & LOGIC ---
function isImageRequest(text) {
    const p = text.toLowerCase();
    const action = /^(imagine|draw|generate|create|make|paint)\b/i;
    const object = /\b(image|picture|photo|pic|art|drawing|sketch)\b/i;
    if (p.startsWith('imagine')) return true;
    if (action.test(p) && object.test(p)) return true;
    return false;
}

imageInput.addEventListener('change', function() {
    if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            pendingImage = e.target.result;
            previewImgSrc.src = pendingImage;
            previewArea.style.display = 'block';
        }
        reader.readAsDataURL(this.files[0]);
    }
    this.value = '';
});

function removePreview() {
    pendingImage = null;
    previewArea.style.display = 'none';
}

function handleSend() {
  const q = inputEl.value.trim();
  
  if (pendingImage) {
      addMessage(q, "user", pendingImage);
      // Pass actual image data to askBot for Vision API
      askBot(q || "Describe this image", pendingImage);
      removePreview();
      inputEl.value = "";
      inputEl.style.height = "auto";
      return;
  }

  if (!q) return;
  
  addMessage(q, "user");
  inputEl.value = "";
  inputEl.style.height = "auto";

  if (isImageRequest(q)) {
      generateImage(q);
  } else {
      askBot(q);
  }
}

sendBtn.onclick = handleSend;
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
inputEl.addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = (this.scrollHeight) + "px";
});

settingsBtn.onclick = () => settingsSheet.classList.add("open");
closeSettings.onclick = () => settingsSheet.classList.remove("open");

clearMemBtn.onclick = () => {
    if(confirm("Delete all chat history?")){
        memory = [];
        localStorage.removeItem("blackchat_memory");
        messagesEl.innerHTML = "";
        addMessage("History cleared.", "bot");
        settingsSheet.classList.remove("open");
    }
};

creatorBtn.onclick = () => {
  settingsSheet.classList.remove("open");
  creatorPanel.classList.add("open");
};
closeCreator.onclick = () => creatorPanel.classList.remove("open");

themeSelectEl.onchange = saveSettings;
stylePromptEl.oninput = saveSettings;

shareBtn.onclick = async () => {
  const url = window.location.href;
  const shareData = {
    title: "Black Chat",
    text: "Try Black Chat — a free AI chatbot created by Mohiuddin Abdul Kadir Dhrubo.",
    url: url
  };

  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch (err) {}
  } else {
    try {
        await navigator.clipboard.writeText(url);
        alert("Link copied to clipboard! 📋");
    } catch (err) {
        const input = document.createElement('textarea');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert("Link copied to clipboard! 📋");
    }
  }
};

if (memory.length === 0) {
  addMessage("Hello! I’m Black Chat. How can I help?", "bot");
} else {
  memory.forEach(m => {
      const txt = m.content || m.text;
      if(m.role !== 'system' && txt) addMessage(txt, m.role === "assistant" ? "bot" : "user");
  });
}
</script>
